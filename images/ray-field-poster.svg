<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 478" fill="none" aria-hidden="true">
  <!-- Static poster for the hero routing field: evidence lanes converging on
       Ray, settled. Shown before the canvas hydrates and whenever the canvas is
       skipped (reduced motion, Save-Data, no 2D context). Meaningful alone. -->
  <defs>
    <radialGradient id="rfp-settle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F66F00" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FCCC3C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F66F00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="260" cy="239" r="150" fill="url(#rfp-settle)"/>
  <g stroke="#F66F00" stroke-opacity="0.14" stroke-width="1" fill="none">
    <path d="M-20,60 C150,60 150,239 200,239"/>
    <path d="M-20,120 C150,120 150,239 200,239"/>
    <path d="M-20,180 C160,180 160,239 200,239"/>
    <path d="M-20,300 C160,300 160,239 200,239"/>
    <path d="M-20,360 C150,360 150,239 200,239"/>
    <path d="M540,90 C370,90 370,239 320,239"/>
    <path d="M540,180 C370,180 370,239 320,239"/>
    <path d="M540,300 C370,300 370,239 320,239"/>
    <path d="M540,388 C370,388 370,239 320,239"/>
  </g>
  <g fill="#F66F00" fill-opacity="0.5">
    <circle cx="120" cy="150" r="2"/>
    <circle cx="150" cy="300" r="2"/>
    <circle cx="400" cy="160" r="2"/>
    <circle cx="380" cy="320" r="2"/>
  </g>
  <g fill="#FCCC3C" fill-opacity="0.42">
    <circle cx="90" cy="90" r="1.7"/>
    <circle cx="430" cy="360" r="1.7"/>
  </g>
  <circle cx="260" cy="239" r="120" stroke="#FCCC3C" stroke-opacity="0.10" stroke-width="1" fill="none"/>
</svg>
